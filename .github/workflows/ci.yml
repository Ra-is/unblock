name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check unblock tests scripts
      - run: uv run pytest -q
      - run: uv run cfn-lint infra/*.yaml
      - run: node --check unblock/web/app.js
